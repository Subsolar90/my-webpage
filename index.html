<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Coffee</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cafe">
        <header class="header">
            <h1 class="sign">☕ Morning Coffee ☕</h1>
            <p class="subtitle">Paul &amp; Phil's daily ritual</p>
        </header>

        <div class="scene">
            <!-- Wall -->
            <div class="wall"></div>

            <!-- Wall decorations -->
            <div class="shelf">
                <span>☕</span><span>☕</span><span>☕</span>
                <span>🥐</span>
            </div>

            <div class="menu-board">
                <div class="menu-title">~ menu ~</div>
                <div>cappuccino · 3€</div>
                <div>flat white · 3€</div>
                <div>smile · free</div>
            </div>

            <div class="window-frame">
                <div class="window-pane"></div>
            </div>

            <!-- Steam from machine -->
            <div class="steam" id="steam"><span></span><span></span><span></span></div>

            <!-- Thought bubbles -->
            <div class="bubble bubble-paul">
                <span id="paul-thought">need coffee...</span>
            </div>
            <div class="bubble bubble-phil">
                <span id="phil-thought">...</span>
            </div>

            <!-- Barista -->
            <div class="barista" id="barista">
                <svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
                    <!-- Apron / chest -->
                    <path d="M 18,90 Q 50,75 82,90 L 82,110 L 18,110 Z" fill="#f5f0e8"/>
                    <rect x="18" y="86" width="64" height="6" fill="#3a3a3a"/>
                    <!-- Apron strings -->
                    <line x1="30" y1="86" x2="36" y2="78" stroke="#3a3a3a" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="70" y1="86" x2="64" y2="78" stroke="#3a3a3a" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Neck -->
                    <rect x="42" y="68" width="16" height="14" fill="#f5d0a8"/>
                    <!-- Head -->
                    <circle cx="50" cy="42" r="28" fill="#f5d0a8"/>
                    <!-- Hair / beanie -->
                    <path d="M 22,42 Q 50,8 78,42 L 78,32 Q 50,8 22,32 Z" fill="#3a2a1a"/>
                    <!-- Beanie band -->
                    <rect x="22" y="38" width="56" height="5" fill="#5a3a1a"/>
                    <!-- Eyes -->
                    <circle cx="40" cy="44" r="2.5" fill="#222"/>
                    <circle cx="60" cy="44" r="2.5" fill="#222"/>
                    <!-- Mustache -->
                    <path d="M 38,55 Q 50,59 62,55" stroke="#3a2a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                    <!-- Smile -->
                    <path d="M 42,60 Q 50,64 58,60" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            </div>

            <!-- Counter -->
            <div class="counter">
                <div class="counter-edge"></div>
            </div>

            <!-- Espresso machine -->
            <div class="machine" id="machine">
                <div class="machine-top">
                    <div class="machine-logo">LA MARZOCCO</div>
                </div>
                <div class="machine-body">
                    <div class="machine-display"></div>
                    <div class="machine-knobs">
                        <span></span><span></span>
                    </div>
                </div>
                <div class="machine-groups">
                    <div class="group-head"></div>
                    <div class="group-head"></div>
                </div>
                <div class="machine-base"></div>
            </div>

            <!-- Coffee cups -->
            <div class="cup" id="cup-paul">
                <div class="cup-body"></div>
                <div class="cup-coffee"></div>
                <div class="cup-handle"></div>
            </div>
            <div class="cup" id="cup-phil">
                <div class="cup-body"></div>
                <div class="cup-coffee"></div>
                <div class="cup-handle"></div>
            </div>

            <!-- Paul (left) -->
            <div class="character paul" id="paul">
                <svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Body -->
                    <rect x="22" y="118" width="56" height="80" fill="#4a7ab9" rx="6"/>
                    <!-- Collar -->
                    <path d="M 38,118 L 50,128 L 62,118 Z" fill="#3a5a90"/>
                    <!-- Arms -->
                    <rect x="10" y="120" width="14" height="60" fill="#4a7ab9" rx="6"/>
                    <rect x="76" y="120" width="14" height="60" fill="#4a7ab9" rx="6"/>
                    <!-- Hands -->
                    <circle cx="17" cy="182" r="9" fill="#f5d0a8"/>
                    <circle cx="83" cy="182" r="9" fill="#f5d0a8"/>
                    <!-- Neck -->
                    <rect x="42" y="105" width="16" height="14" fill="#f5d0a8"/>
                    <!-- Head -->
                    <circle cx="50" cy="72" r="32" fill="#f5d0a8"/>
                    <!-- Hair (messy) -->
                    <path d="M 20,68 Q 28,28 50,30 Q 72,28 80,68 Q 80,50 60,40 Q 50,42 40,40 Q 20,50 20,68 Z" fill="#5a3a1a"/>
                    <!-- Eyes (happy/closed-arc) -->
                    <path d="M 36,72 Q 40,76 44,72" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <path d="M 56,72 Q 60,76 64,72" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <!-- Smile -->
                    <path d="M 38,86 Q 50,96 62,86" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <!-- Cheek blush -->
                    <circle cx="32" cy="82" r="3.5" fill="#ffb0a0" opacity="0.65"/>
                    <circle cx="68" cy="82" r="3.5" fill="#ffb0a0" opacity="0.65"/>
                </svg>
            </div>

            <!-- Phil (right) -->
            <div class="character phil" id="phil">
                <svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Body -->
                    <rect x="22" y="118" width="56" height="80" fill="#6a3a3a" rx="6"/>
                    <!-- Collar -->
                    <path d="M 38,118 L 50,128 L 62,118 Z" fill="#4a2a2a"/>
                    <!-- Arms -->
                    <rect x="10" y="120" width="14" height="60" fill="#6a3a3a" rx="6"/>
                    <rect x="76" y="120" width="14" height="60" fill="#6a3a3a" rx="6"/>
                    <!-- Hands -->
                    <circle cx="17" cy="182" r="9" fill="#f5d0a8"/>
                    <circle cx="83" cy="182" r="9" fill="#f5d0a8"/>
                    <!-- Neck -->
                    <rect x="42" y="105" width="16" height="14" fill="#f5d0a8"/>
                    <!-- Head -->
                    <circle cx="50" cy="72" r="32" fill="#f5d0a8"/>
                    <!-- Hair (short, neat) -->
                    <path d="M 22,64 Q 50,28 78,64 L 78,56 Q 50,26 22,56 Z" fill="#2a2a2a"/>
                    <!-- Eyes -->
                    <circle cx="40" cy="74" r="3" fill="#222"/>
                    <circle cx="60" cy="74" r="3" fill="#222"/>
                    <!-- Grumpy face (default) -->
                    <g class="face-grumpy">
                        <line x1="32" y1="62" x2="44" y2="68" stroke="#222" stroke-width="3" stroke-linecap="round"/>
                        <line x1="56" y1="68" x2="68" y2="62" stroke="#222" stroke-width="3" stroke-linecap="round"/>
                        <path d="M 38,92 Q 50,84 62,92" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    </g>
                    <!-- Happy face (after coffee) -->
                    <g class="face-happy">
                        <line x1="32" y1="64" x2="44" y2="62" stroke="#222" stroke-width="3" stroke-linecap="round"/>
                        <line x1="56" y1="62" x2="68" y2="64" stroke="#222" stroke-width="3" stroke-linecap="round"/>
                        <path d="M 38,86 Q 50,96 62,86" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                        <circle cx="32" cy="82" r="3.5" fill="#ffb0a0" opacity="0.65"/>
                        <circle cx="68" cy="82" r="3.5" fill="#ffb0a0" opacity="0.65"/>
                    </g>
                </svg>
            </div>
        </div>

        <div class="controls">
            <button id="cappuccino-btn">☕ Order Cappuccino</button>
            <button id="flatwhite-btn">🥛 Order Flat White</button>
        </div>

        <footer class="footer">
            <p>made with ♥ for Paul &amp; Phil</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
